services:
  postgres:
    image: postgres:16
    container_name: sql-demo
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: nosql-demo
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    container_name: redis-demo
    ports:
      - "6379:6379"

volumes:
  postgres_data: